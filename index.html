<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="workspace-token" content="">
<meta name="referrer" content="no-referrer">
<title>Workspace board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='3' rx='1' fill='%2322a447'/%3E%3Crect x='1' y='7' width='9' height='3' rx='1' fill='%23f59e0b'/%3E%3Crect x='1' y='12' width='5' height='3' rx='1' fill='%23e5372a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="in">
  <span class="brand">Workspace board</span>
  <nav class="tabs" id="tabs" aria-label="Pages"></nav>
  <div class="right">
    <span class="conn" id="conn"><i></i>Connecting…</span>
    <button type="button" class="btn ghost small" id="theme" title="Theme: follows the system">Auto</button>
  </div>
</div></header>
<main id="main"><p class="empty">Loading…</p></main>
<dialog id="dlg"><form id="dlgForm" method="dialog">
  <h2 id="dlgTitle"></h2>
  <div class="meta" id="dlgTask"></div>
  <div class="qtext" id="dlgQ"></div>
  <div class="rec" id="dlgRec" hidden></div>
  <div class="opts" id="dlgOpts"></div>
  <label for="dlgText" id="dlgLabel">Your answer</label>
  <textarea id="dlgText"></textarea>
  <div class="err" id="dlgErr" role="alert"></div>
  <div class="actions"><span class="hint">Ctrl+Enter sends</span>
    <button type="button" class="btn ghost" id="dlgCancel">Cancel</button>
    <button type="submit" class="btn" id="dlgSend">Send answer</button></div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
